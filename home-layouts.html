<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>主页排版方案</title>
<style>
  :root{
    --bg:#02102F; --panel:rgba(4,26,64,.62);
    --hi:#F2F8FF; --t2:#CDE3FA; --t3:#8FAFD6; --cy:#7FD0FB; --pink:#FD77D9;
    --ff:"HarmonyOS Sans SC","Microsoft YaHei UI","Segoe UI",sans-serif;
    --ffd:"Rajdhani","Bahnschrift","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#07090f;color:var(--hi);font-family:var(--ff);padding:26px 26px 34px}
  h1{font-size:15px;font-weight:600;letter-spacing:.16em;margin-bottom:4px}
  .sub{font-size:11px;color:#7d8ba6;letter-spacing:.1em;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:600px 600px;gap:22px}
  .cap{margin-top:8px;font-size:12px;color:#93a3bd;line-height:1.55}
  .cap b{color:#eaf2ff;font-size:12.5px;letter-spacing:.06em}
  .cap span{color:#5f7291}
  .slot{position:relative;width:600px;height:390px;overflow:hidden;border-radius:4px;
    border:1px solid rgba(140,190,255,.14);background:#02102F}
  .stage{position:absolute;left:0;top:0;width:1200px;height:780px;transform:scale(.5);transform-origin:0 0;
    background:radial-gradient(90% 70% at 78% 8%,rgba(90,190,245,.30) 0%,transparent 60%),
      linear-gradient(168deg,#0B4FB8 0%,#02102F 100%)}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
  .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,9,32,.86) 0%,rgba(2,9,32,.5) 34%,rgba(2,9,32,.16) 62%,rgba(2,9,32,.34) 100%)}
  .waves{position:absolute;left:0;right:0;bottom:0;height:92px;opacity:.95}
  .waves i{position:absolute;left:-6%;right:-6%;bottom:0;height:100%;display:block;background:var(--cy);opacity:.5;
    clip-path:polygon(0% 78%,8% 66%,18% 72%,28% 58%,38% 68%,48% 54%,58% 66%,70% 52%,82% 64%,92% 56%,100% 68%,100% 100%,0% 100%)}
  .waves i:nth-child(2){opacity:.34;bottom:-14px;clip-path:polygon(0% 86%,10% 74%,22% 80%,34% 66%,46% 76%,58% 64%,70% 74%,84% 62%,100% 74%,100% 100%,0% 100%)}
  .rail{position:absolute;left:0;top:0;bottom:0;width:118px;background:linear-gradient(90deg,rgba(2,14,40,.56),rgba(2,14,40,.22));
    border-right:1px solid rgba(170,215,255,.12);backdrop-filter:blur(10px);padding:26px 14px}
  .wordmark{font-family:var(--ffd);font-size:10px;letter-spacing:.28em;color:var(--t3)}
  .topbar{position:absolute;left:118px;right:0;top:0;height:74px;display:flex;align-items:center;gap:12px;
    padding:0 30px;border-bottom:1px solid rgba(150,200,255,.10)}
  .logo{width:26px;height:26px;background:#fff;clip-path:polygon(0 0,100% 0,100% 62%,52% 62%,52% 100%,0 100%)}
  .tb-t{font-size:19px;font-weight:700;letter-spacing:.06em}
  .tb-s{font-family:var(--ffd);font-size:11px;letter-spacing:.3em;color:var(--t3)}
  .tb-r{margin-left:auto;font-size:11.5px;color:var(--t3);letter-spacing:.12em}
  /* 今日块 */
  .today{font-variant-numeric:tabular-nums}
  .tclock{font-family:var(--ffd);font-weight:700;line-height:.92;letter-spacing:.01em;color:#fff}
  .tampm{font-size:15px;color:var(--t2);margin-left:10px;letter-spacing:.1em}
  .tdate{font-size:13px;color:var(--t3);letter-spacing:.06em;margin-top:10px}
  .tsep{height:1px;background:linear-gradient(90deg,rgba(150,205,255,.5),transparent);margin:14px 0 12px}
  .trow{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--t2);margin-top:7px}
  .trow i{font-style:normal;font-family:var(--ffd);font-size:9.5px;letter-spacing:.2em;color:rgba(170,214,248,.8);width:64px;flex:none}
  /* 菜单 */
  .menu{display:flex;flex-direction:column}
  .opt{position:relative;display:flex;align-items:center;gap:16px;padding:6px 0}
  .opt .pair{display:flex;align-items:baseline;gap:14px}
  .cjk{font-size:76px;font-weight:700;line-height:1;color:var(--cy);letter-spacing:.02em}
  .en{font-family:var(--ffd);font-size:13px;letter-spacing:.3em;color:var(--t3)}
  .opt.sel .cjk{color:#fff}
  .opt.sel::before{content:"";position:absolute;left:-18px;top:50%;width:4px;height:38px;margin-top:-19px;background:var(--pink)}
  /* session */
  .sess{font-size:12.5px;color:var(--t2)}
  .sess .cap2{font-family:var(--ffd);font-size:10px;letter-spacing:.3em;color:var(--t3);display:block;margin-bottom:8px}
  .sess .model{font-size:30px;font-weight:700;color:#fff;letter-spacing:.01em;margin-bottom:12px}
  .sess .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(150,200,255,.10)}
  .sess .kv span:last-child{color:#fff}
</style>
</head>
<body>
<h1>主页排版方案 · 保留现有选项与时间/天气/日程内容</h1>
<div class="sub">COMMON CONTENT — 开始 / 设置 / API 接入 / 退出；05:12 深夜 · 10月18日 周日 · WEATHER · SCHEDULE · SESSION 面板</div>

<div class="grid">

  <!-- A -->
  <figure>
    <div class="slot"><div class="stage">
      <video src="Unnamedbot/webui/media/fv_movie2.mp4" muted autoplay loop playsinline></video>
      <div class="scrim"></div>
      <div class="rail"><div class="wordmark">UNNAMEDBOT</div></div>
      <div class="topbar"><div class="logo"></div><div class="tb-t">桌宠中枢</div><div class="tb-s">AGENT PET HUB</div><div class="tb-r">○ API 未测试</div></div>

      <!-- 左栏：时间在上，菜单紧随其下 -->
      <div class="today" style="position:absolute;left:168px;top:132px;width:420px">
        <div style="display:flex;align-items:baseline"><div class="tclock" style="font-size:104px">05:12</div><div class="tampm">深夜</div></div>
        <div class="tdate">10月18日 · 周日</div>
        <div class="tsep"></div>
        <div class="trow"><i>WEATHER</i>多云 22°C 东风 2 级</div>
        <div class="trow"><i>SCHEDULE</i>21:30 喝水提醒</div>
      </div>
      <div class="menu" style="position:absolute;left:168px;top:424px;gap:26px">
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:52px">开始</div><div class="en">START</div></div></div>
        <div class="opt sel"><div class="pair"><div class="cjk" style="font-size:52px">设置</div><div class="en">SETTINGS</div></div></div>
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:52px">API 接入</div><div class="en">ENDPOINT</div></div></div>
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:52px">退出</div><div class="en">QUIT</div></div></div>
      </div>
      <div class="sess" style="position:absolute;right:56px;bottom:74px;width:290px;text-align:right">
        <span class="cap2">SESSION</span>
        <div class="model">mistral-large-latest</div>
        <div class="kv"><span>人设</span><span>关闭</span></div>
        <div class="kv"><span>快速模式</span><span>关闭</span></div>
        <div class="kv"><span>上下文</span><span>30 轮 · 4096 tok</span></div>
      </div>
      <div class="waves"><i></i><i></i></div>
    </div></div>
    <figcaption class="cap"><b>A · 左栏纵排</b> <span>／ 时间与菜单共用左边线，时间在上菜单在下，形成一条竖直信息轴；SESSION 退到右下，画面右 2/3 完全留给角色。</span></figcaption>
  </figure>

  <!-- B -->
  <figure>
    <div class="slot"><div class="stage">
      <video src="Unnamedbot/webui/media/fv_movie2.mp4" muted autoplay loop playsinline></video>
      <div class="scrim" style="background:linear-gradient(180deg,rgba(2,9,32,.5) 0%,rgba(2,9,32,.1) 32%,rgba(2,9,32,.72) 78%,rgba(2,9,32,.9) 100%)"></div>
      <div class="rail"><div class="wordmark">UNNAMEDBOT</div></div>
      <div class="topbar"><div class="logo"></div><div class="tb-t">桌宠中枢</div><div class="tb-s">AGENT PET HUB</div><div class="tb-r">○ API 未测试</div></div>

      <!-- 中间大时间，底部横带 -->
      <div class="today" style="position:absolute;left:50%;top:164px;transform:translateX(-50%);text-align:center;text-shadow:0 6px 40px rgba(2,10,30,.55)">
        <div style="display:flex;align-items:baseline;justify-content:center"><div class="tclock" style="font-size:150px">05:12</div><div class="tampm" style="font-size:20px">深夜</div></div>
        <div class="tdate" style="font-size:14px">10月18日 · 周日</div>
      </div>
      <div style="position:absolute;left:0;right:0;bottom:0;height:206px;background:linear-gradient(180deg,rgba(2,12,36,0),rgba(2,12,36,.82) 34%,rgba(2,12,36,.94));
                  border-top:1px solid rgba(150,200,255,.14)"></div>
      <div class="today" style="position:absolute;left:56px;bottom:56px;width:330px">
        <div class="trow"><i>WEATHER</i>多云 22°C 东风 2 级</div>
        <div class="trow"><i>SCHEDULE</i>21:30 喝水提醒</div>
      </div>
      <div class="menu" style="position:absolute;right:56px;bottom:48px;flex-direction:row;gap:44px;align-items:flex-end">
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:40px">开始</div><div class="en">START</div></div></div>
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:40px">设置</div><div class="en">SETTINGS</div></div></div>
        <div class="opt sel"><div class="pair"><div class="cjk" style="font-size:40px">API 接入</div><div class="en">ENDPOINT</div></div></div>
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:40px">退出</div><div class="en">QUIT</div></div></div>
      </div>
      <div class="sess" style="position:absolute;left:50%;bottom:172px;transform:translateX(-50%);text-align:center;width:520px">
        <span class="cap2">SESSION · mistral-large-latest · 30 轮 · 4096 tok</span>
      </div>
      <div class="waves"><i></i><i></i></div>
    </div></div>
    <figcaption class="cap"><b>B · 中轴 + 底带</b> <span>／ 时间居中放大成主角，四个选项横排进底部信息带，天气/日程贴左下；整块画面在上方完整露出。</span></figcaption>
  </figure>

  <!-- C -->
  <figure>
    <div class="slot"><div class="stage">
      <video src="Unnamedbot/webui/media/fv_movie2.mp4" muted autoplay loop playsinline></video>
      <div class="scrim" style="background:linear-gradient(90deg,rgba(2,9,32,.9) 0%,rgba(2,9,32,.62) 40%,rgba(2,9,32,.18) 70%,rgba(2,9,32,.28) 100%)"></div>
      <div class="rail"><div class="wordmark">UNNAMEDBOT</div></div>
      <div class="topbar"><div class="logo"></div><div class="tb-t">桌宠中枢</div><div class="tb-s">AGENT PET HUB</div><div class="tb-r">○ API 未测试</div></div>

      <!-- 左：时间 + 天气/日程分两列；右：菜单右对齐 -->
      <div class="today" style="position:absolute;left:168px;top:180px;width:400px">
        <div style="display:flex;align-items:baseline"><div class="tclock" style="font-size:96px">05:12</div><div class="tampm">深夜</div></div>
        <div class="tdate">10月18日 · 周日</div>
      </div>
      <div class="today" style="position:absolute;left:168px;bottom:156px;display:flex;gap:56px">
        <div><i style="font-style:normal;font-family:var(--ffd);font-size:9.5px;letter-spacing:.2em;color:rgba(170,214,248,.8)">WEATHER</i>
          <div style="font-size:13px;color:#CDE3FA;margin-top:6px;max-width:170px">多云 22°C<br>东风 2 级</div></div>
        <div><i style="font-style:normal;font-family:var(--ffd);font-size:9.5px;letter-spacing:.2em;color:rgba(170,214,248,.8)">SCHEDULE</i>
          <div style="font-size:13px;color:#CDE3FA;margin-top:6px">21:30<br>喝水提醒</div></div>
      </div>
      <div class="menu" style="position:absolute;right:64px;top:50%;transform:translateY(-50%);gap:20px;align-items:flex-end;text-align:right">
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:66px">开始</div><div class="en">START</div></div></div>
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:66px">设置</div><div class="en">SETTINGS</div></div></div>
        <div class="opt sel"><div class="pair"><div class="cjk" style="font-size:66px">API 接入</div><div class="en">ENDPOINT</div></div></div>
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:66px">退出</div><div class="en">QUIT</div></div></div>
      </div>
      <div class="sess" style="position:absolute;right:64px;top:96px;width:250px;text-align:right">
        <span class="cap2">mistral-large-latest</span>
        <div style="font-size:11.5px;color:var(--t3)">30 轮 · 4096 tok</div>
      </div>
      <div class="waves"><i></i><i></i></div>
    </div></div>
    <figcaption class="cap"><b>C · 对角平衡</b> <span>／ 时间左上、菜单右下，天气/日程压在底部两列形成第三条基线；三角构图，视线从时间斜滑到菜单。</span></figcaption>
  </figure>

  <!-- D -->
  <figure>
    <div class="slot"><div class="stage">
      <video src="Unnamedbot/webui/media/fv_movie2.mp4" muted autoplay loop playsinline></video>
      <div class="scrim" style="background:linear-gradient(180deg,rgba(2,9,32,.62) 0%,rgba(2,9,32,.2) 26%,rgba(2,9,32,.2) 62%,rgba(2,9,32,.7) 100%)"></div>
      <div class="rail" style="width:86px"><div class="wordmark" style="writing-mode:vertical-rl;letter-spacing:.36em">UNNAMEDBOT</div></div>
      <div class="topbar" style="left:86px"><div class="logo"></div><div class="tb-t">桌宠中枢</div><div class="tb-s">AGENT PET HUB</div><div class="tb-r">○ API 未测试</div></div>

      <!-- 四角网格：时间左上、菜单右上、天气左下、日程右下 -->
      <div class="today" style="position:absolute;left:150px;top:130px">
        <div style="display:flex;align-items:baseline"><div class="tclock" style="font-size:88px">05:12</div><div class="tampm">深夜</div></div>
        <div class="tdate">10月18日 · 周日</div>
      </div>
      <div class="menu" style="position:absolute;right:52px;top:120px;align-items:flex-end;gap:6px">
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:44px;font-weight:400">开始</div><div class="en">START</div></div></div>
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:44px;font-weight:400">设置</div><div class="en">SETTINGS</div></div></div>
        <div class="opt sel"><div class="pair"><div class="cjk" style="font-size:44px;font-weight:400">API 接入</div><div class="en">ENDPOINT</div></div></div>
        <div class="opt"><div class="pair"><div class="cjk" style="font-size:44px;font-weight:400">退出</div><div class="en">QUIT</div></div></div>
      </div>
      <div class="today" style="position:absolute;left:150px;bottom:64px">
        <div class="trow"><i>WEATHER</i>多云 22°C 东风 2 级</div>
        <div class="trow"><i>SCHEDULE</i>21:30 喝水提醒</div>
      </div>
      <div class="sess" style="position:absolute;right:52px;bottom:64px;text-align:right;width:260px">
        <span class="cap2">SESSION</span>
        <div class="model" style="font-size:22px">mistral-large-latest</div>
        <div style="font-size:11.5px;color:var(--t3)">30 轮 · 4096 tok · 工具 全部</div>
      </div>
      <div class="waves"><i></i><i></i></div>
    </div></div>
    <figcaption class="cap"><b>D · 四角留白</b> <span>／ 只占四角，中间整块留白给角色；侧栏收窄成竖写字标，信息全部用细字重，画面最"空"。</span></figcaption>
  </figure>

</div>
</body>
</html>
